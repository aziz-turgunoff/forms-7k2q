var KEY = "klinika_savollar_v2";
var state = {};
function lsGet(){try{var s=localStorage.getItem(KEY);return s?JSON.parse(s):{};}catch(e){return {};}}
function lsSet(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function lsClear(){try{localStorage.removeItem(KEY);}catch(e){}}
state = lsGet();
var Q = [];
DATA.sections.forEach(function(s){s.qs.forEach(function(q){q.sec=s;Q.push(q);});});
var pos = (typeof state._pos==="number" && state._pos>=0 && state._pos<Q.length)?state._pos:0;
var mode = "start";
var OTHER = DATA.other;
function $(id){return document.getElementById(id);}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}
function has(q){var v=state[q.id];if(q.t==="multi")return Array.isArray(v)&&v.length>0;return typeof v==="string"&&v.trim()!=="";}
function nAnswered(){var n=0;Q.forEach(function(q){if(has(q))n++;});return n;}
function save(){state._pos=pos;lsSet();}
function setProgress(){
 var q=Q[pos];var inSec=q.sec.qs.indexOf(q)+1;
 $("lbl").textContent=q.sec.id+". "+q.sec.title+"  ·  "+inSec+"/"+q.sec.qs.length;
 $("pb").style.width=Math.round((pos+1)/Q.length*100)+"%";
}
function show(m){
 mode=m;
 var isQ=(m==="q");
 $("top").classList.toggle("hidden",!isQ&&m!=="end");
 $("nav").classList.toggle("hidden",!isQ);
 $("main").innerHTML="";window.scrollTo(0,0);
 if(m==="start")renderStart();else if(m==="q")renderQ();else renderEnd();
}
function renderStart(){
 var m=$("main");
 m.appendChild(el("h1",null,DATA.title));
 m.appendChild(el("p",null,DATA.intro));
 m.appendChild(el("p","muted","Taxminan 25-30 daqiqa. Bir yo'la qilish shart emas: javoblaringiz shu telefonda saqlanadi, istalgan payt to'xtab, keyin davom etishingiz mumkin. Javoblar hech qayerga o'zi yuborilmaydi."));
 m.appendChild(el("p","muted","Savollar bir-bir chiqadi. Javob bermoqchi bo'lmasangiz, \"Keyingi\" ni bosing."));
 var st=el("div","stack");
 var n=nAnswered();
 if(n>0){var c=el("button","primary","Davom etish ("+n+" ta javob saqlangan)");c.addEventListener("click",function(){var i=firstUn();pos=(i>=0?i:pos);show("q");});st.appendChild(c);
  var r=el("button",null,"Boshidan boshlash");r.addEventListener("click",function(){pos=0;show("q");});st.appendChild(r);}
 else{var b=el("button","primary","Boshlash");b.addEventListener("click",function(){pos=0;show("q");});st.appendChild(b);}
 m.appendChild(st);
}
function firstUn(){for(var i=0;i<Q.length;i++){if(!has(Q[i]))return i;}return -1;}
function go(d){
 if(d>0&&pos>=Q.length-1){save();show("end");return;}
 pos=Math.max(0,Math.min(Q.length-1,pos+d));save();show("q");
}
function renderQ(){
 var q=Q[pos],m=$("main");setProgress();
 var first=(q.sec.qs.indexOf(q)===0);
 m.appendChild(el("h2",null,q.t==="func"?("Sizga kerakmi: "+q.q):q.q));
 if(q.t==="func"){m.appendChild(el("p","muted",DATA.desc[q.id]||""));}
 if(q.sec.id==="A"&&q.id==="A.1"){m.appendChild(el("p","hint","To'g'ri yoki noto'g'ri javob yo'q. O'z so'zingiz bilan yozing. Telefon klaviaturasidagi mikrofon tugmasini bossangiz, gapirib yozish ham mumkin (telefoningiz o'zbek tilini bilsa)."));}
 if(q.sec.id==="14"&&q.id==="14.1"){m.appendChild(el("p","hint","Har bir funksiya uchun tanlang: juda kerak, bo'lsa yaxshi yoki kerak emas. Bilmasangiz, \"Bilmayman\" ni tanlang."));}
 if(q.t==="text"||q.t==="long"){
  var inp=q.t==="long"?document.createElement("textarea"):document.createElement("input");
  if(q.t==="text")inp.type="text";
  inp.value=state[q.id]||"";inp.setAttribute("aria-label",q.q);
  inp.addEventListener("input",function(){state[q.id]=inp.value;lsSet();});
  m.appendChild(inp);
 }else if(q.t==="func"){
  var opts=DATA.func;
  opts.forEach(function(o,i){
   var b=el("button","opt"+(state[q.id]===o?" on":"")+(i===3?" small":""));b.type="button";
   b.appendChild(el("span","dot"));b.appendChild(el("span",null,o));
   b.addEventListener("click",function(){state[q.id]=(state[q.id]===o?"":o);save();if(state[q.id]){setTimeout(function(){go(1);},180);}else{show("q");}});
   m.appendChild(b);
  });
 }else if(q.t==="choice"){
  var all=q.o.concat([OTHER]);
  all.forEach(function(o){
   var b=el("button","opt"+(state[q.id]===o?" on":"")+(o===OTHER?" small":""));b.type="button";
   b.appendChild(el("span","dot"));b.appendChild(el("span",null,o));
   b.addEventListener("click",function(){
    if(state[q.id]===o){state[q.id]="";save();show("q");return;}
    state[q.id]=o;save();
    if(o===OTHER){show("q");var t=document.getElementById("oth");if(t)t.focus();}else{setTimeout(function(){go(1);},180);}
   });
   m.appendChild(b);
  });
  if(state[q.id]===OTHER){var w=el("div","other");var ta=document.createElement("input");ta.type="text";ta.id="oth";ta.placeholder="O'zingiz yozing";ta.value=state[q.id+"_o"]||"";ta.addEventListener("input",function(){state[q.id+"_o"]=ta.value;lsSet();});w.appendChild(ta);m.appendChild(w);}
 }else if(q.t==="multi"){
  var cur=Array.isArray(state[q.id])?state[q.id]:[];
  m.appendChild(el("p","muted","Bir nechtasini tanlash mumkin."));
  q.o.concat([OTHER]).forEach(function(o){
   var on=cur.indexOf(o)>=0;
   var b=el("button","opt multi"+(on?" on":"")+(o===OTHER?" small":""));b.type="button";
   b.appendChild(el("span","dot"));b.appendChild(el("span",null,o));
   b.addEventListener("click",function(){
    var a=Array.isArray(state[q.id])?state[q.id].slice():[];var i=a.indexOf(o);
    if(i>=0)a.splice(i,1);else a.push(o);
    state[q.id]=a;save();show("q");
    if(o===OTHER&&a.indexOf(OTHER)>=0){var t=document.getElementById("oth");if(t)t.focus();}
   });
   m.appendChild(b);
  });
  if(cur.indexOf(OTHER)>=0){var w2=el("div","other");var t2=document.createElement("input");t2.type="text";t2.id="oth";t2.placeholder="O'zingiz yozing";t2.value=state[q.id+"_o"]||"";t2.addEventListener("input",function(){state[q.id+"_o"]=t2.value;lsSet();});w2.appendChild(t2);m.appendChild(w2);}
 }
 $("back").classList.toggle("hidden",pos===0);
 $("next").textContent=(pos>=Q.length-1)?"Tugatish":"Keyingi";
}
function valueText(q){
 var v=state[q.id];
 if(q.t==="multi"){var a=(v||[]).map(function(x){return x===OTHER?("Boshqa: "+(state[q.id+"_o"]||"").trim()):x;});return a.join(", ");}
 if(v===OTHER)return "Boshqa: "+(state[q.id+"_o"]||"").trim();
 return (v||"").trim();
}
function build(){
 var out=[DATA.title.toUpperCase(),""],miss=[];
 DATA.sections.forEach(function(s){
  out.push(s.id+"-BO'LIM. "+s.title.toUpperCase());
  s.qs.forEach(function(q){
   if(!has(q)){miss.push(q.id);return;}
   out.push(q.id+". "+q.q+"\n   Javob: "+valueText(q));
  });
  out.push("");
 });
 out.push(miss.length?("Javob berilmagan savollar ("+miss.length+" ta): "+miss.join(", ")):"Hamma savolga javob berildi.");
 return {text:out.join("\n"),miss:miss};
}
function say(t){var e=$("msg");if(e)e.textContent=t;}
function copyText(t){
 if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(t);}
 return new Promise(function(res,rej){var ta=$("res");ta.removeAttribute("readonly");ta.select();ta.setSelectionRange(0,t.length);var ok=false;try{ok=document.execCommand("copy");}catch(e){}ta.setAttribute("readonly","");ok?res():rej();});
}
function renderEnd(){
 var m=$("main");var r=build();
 $("lbl").textContent="Tayyor";$("pb").style.width="100%";
 m.appendChild(el("h2",null,"Rahmat!"));
 m.appendChild(el("p",null,"Endi javoblarni Azizbekka yuboring. Pastdagi tugmalardan birini bosing."));
 if(r.miss.length){var p=el("p","muted","Javob berilmagan savollar: "+r.miss.length+" ta. Xohlasangiz, ularga qaytib javob bering yoki shunday yuboring.");m.appendChild(p);
  var bk=el("button",null,"Javobsiz savollarga qaytish");bk.addEventListener("click",function(){var i=firstUn();if(i>=0){pos=i;show("q");}});m.appendChild(bk);}
 var ta=document.createElement("textarea");ta.id="res";ta.className="res";ta.readOnly=true;ta.value=r.text;ta.style.marginTop="14px";m.appendChild(ta);
 var st=el("div","stack");
 var sh=el("button","primary","Telegramga yuborish");sh.addEventListener("click",function(){var t=$("res").value;
  if(navigator.share){navigator.share({title:DATA.title,text:t}).then(function(){say("");},function(){say("Yuborilmadi. \"Nusxa olish\" ni bosing.");});}
  else{copyText(t).then(function(){say("Matn nusxalandi. Telegramda suhbatga qo'ying.");},function(){say("Nusxa olinmadi. Matnni qo'lda belgilab nusxalang.");});}
 });st.appendChild(sh);
 var cp=el("button",null,"Nusxa olish");cp.addEventListener("click",function(){var t=$("res").value;copyText(t).then(function(){say("Nusxa olindi. Endi Telegramda suhbatga qo'ying.");},function(){say("Nusxa olinmadi. Matnni qo'lda belgilab nusxalang.");});});st.appendChild(cp);
 if(DATA.tg){var tg=el("button",null,"Nusxa olib, Azizbek bilan chatni ochish");tg.addEventListener("click",function(){var t=$("res").value;copyText(t).then(function(){say("Nusxa olindi. Chatga qo'ying.");window.open("https://t.me/"+DATA.tg,"_blank");},function(){window.open("https://t.me/"+DATA.tg,"_blank");});});st.appendChild(tg);}
 var sv=el("button",null,"Faylga saqlash");sv.addEventListener("click",function(){try{var b=new Blob([$("res").value],{type:"text/plain;charset=utf-8"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="klinika-javoblari.txt";document.body.appendChild(a);a.click();a.remove();say("Fayl saqlandi.");}catch(e){say("Saqlab bo'lmadi. \"Nusxa olish\" ni bosing.");}});st.appendChild(sv);
 var ba=el("button",null,"Savollarga qaytish");ba.addEventListener("click",function(){pos=Q.length-1;show("q");});st.appendChild(ba);
 var rs=el("button","link","Hamma javobni shu telefondan o'chirish");rs.addEventListener("click",function(){if(confirm("Hamma javoblar shu telefondan o'chiriladi. Davom etasizmi?")){state={};lsClear();pos=0;show("start");}});st.appendChild(rs);
 m.appendChild(st);
 var msg=el("p","msg");msg.id="msg";msg.setAttribute("role","status");m.appendChild(msg);
}
$("next").addEventListener("click",function(){go(1);});
$("back").addEventListener("click",function(){go(-1);});
$("mbtn").addEventListener("click",function(){

 DATA.sections.forEach(function(s){
  var k=0;s.qs.forEach(function(q){if(has(q))k++;});
  var li=document.createElement("li");var b=el("button","item");b.type="button";b.appendChild(el("span",null,s.id+". "+s.title));b.appendChild(el("span","muted",k+"/"+s.qs.length));
  b.addEventListener("click",function(){pos=Q.indexOf(s.qs[0]);save();$("menu").classList.add("hidden");show("q");});
  li.appendChild(b);ul.appendChild(li);

});
$("mclose").addEventListener("click",function(){$("menu").classList.add("hidden");});
show("start");
